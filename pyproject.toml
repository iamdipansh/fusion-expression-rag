[project]
name = "fusion-rag-server"
version = "0.1.0"
description = "Hybrid retrieval server over the DaVinci Resolve manual for grounding Fusion expression syntax."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "lancedb>=0.15",
    "tiktoken>=0.8",
    "FlagEmbedding>=1.3",
    "onnxruntime>=1.19",
    "httpx>=0.27",
    "anthropic>=0.40",
    "google-genai>=0.3",
    "transformers>=4.46",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ragas>=0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "pypdfium2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "FlagEmbedding.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "retrieval*", "eval*", "generation*"]

[tool.setuptools]
py-modules = ["config"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
