# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the backend only. The frontend goes to Vercel (see deploy/README.md).
#
# Uses Render's native Python runtime rather than server/Dockerfile: `pip install .` already
# resolves to the lean dependency set (torch and friends live in the `hybrid` extra), and native
# builds are considerably faster than image builds on a 0.1-CPU free instance.
services:
  - type: web
    name: fusion-rag-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install .
    # Render assigns the port via $PORT; binding anything else makes the service unreachable.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # The free instance has 512MB; the hybrid stack needs ~6GB, so lexical is not optional here.
      - key: FUSION_RAG_RETRIEVAL_MODE
        value: lexical
      # Powers both the sufficiency gate and keyless generation in lexical mode. Set the actual
      # value in the Render dashboard — sync:false keeps the secret out of this file and out of git.
      - key: FUSION_RAG_GEMINI_API_KEY
        sync: false
      # JSON array, not comma-separated — pydantic-settings parses list fields as JSON.
      - key: FUSION_RAG_CORS_ORIGINS
        value: '["http://localhost:3000"]'
      # Covers the Vercel production domain and every preview deploy, which each get their own
      # hostname. Scoped to this project's subdomains rather than all of *.vercel.app, so another
      # site on Vercel can't spend this backend's Gemini quota. Widen if the project is renamed.
      - key: FUSION_RAG_CORS_ORIGIN_REGEX
        value: '^https://fusion-(expression-)?rag[a-z0-9-]*\.vercel\.app$'
